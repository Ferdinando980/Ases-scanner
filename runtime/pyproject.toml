[project]
name = "ases"
version = "1.9.0"
description = "Software engineering toolkit and evidence-preserving source analysis"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "tree-sitter>=0.25,<0.26", "tree-sitter-javascript>=0.23,<0.26", "tree-sitter-typescript>=0.23,<0.24"]

[project.scripts]
ases = "ases.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ases*"]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4"]
