name: Tests and installed package
'on': [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: python -m pip install -e "./runtime[documents,test]"
      - run: python -m pytest -q runtime/tests --junitxml=results-${{ matrix.os }}-${{ matrix.python }}.xml
        env:
          TMPDIR: ${{ runner.temp }}
      - run: python -m pip wheel ./runtime --no-deps --wheel-dir dist
      - run: python -m pip install --no-index --no-deps --find-links dist --force-reinstall ases
      - name: Import installed resources outside checkout
        working-directory: ${{ runner.temp }}
        run: python -I -c "from importlib.resources import files; from ases.scanners.java_syntax import parser_profile; assert files('ases.engineering').joinpath('resources/engineering-review.schema.json').is_file(); assert parser_profile()['grammar']; print('Installed package resources available')"
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}-${{ matrix.python }}
          path: results-*.xml
          if-no-files-found: warn
